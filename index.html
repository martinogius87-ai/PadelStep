<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>PadelStep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PadelStep">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#061a34">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="PadelStep-icona.png">
<link rel="icon" type="image/png" href="PadelStep-icona.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
/* Layout: una colonna stretta pensata per il telefono. Barra con tre schede, scheda lezione a blocchi, modo campo a tutto schermo. */
/* Stile club: blu notte, azzurro e oro. Intestazione a stemma, tabellone per i minuti. */
:root{
  --bg:#eef3f9; --surf:#ffffff; --surf2:#e0eaf5; --fg:#0b1f3a; --mut:#4f627c; --line:#c9d7e8;
  --acc:#0b2a55; --acc-fg:#ffffff; --acc-weak:#dbe9f7; --warn:#8a5200; --warn-weak:#fbebcc;
  --gold:#b98a1f; --sky:#6cabdd; --navy:#0b2a55;
  --court:#2d6aa6; --court-line:#f4f7fb; --arrow:#ffd23f;
  --fd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08142a; --surf:#0f2142; --surf2:#172c52; --fg:#eaf1fb; --mut:#9fb3cf; --line:#223963;
  --acc:#6cabdd; --acc-fg:#08142a; --acc-weak:#142c52; --warn:#f0b64a; --warn-weak:#3a2c10; --gold:#d9b45a;
  --court:#2a5f96; --court-line:#e8eef6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08142a; --surf:#0f2142; --surf2:#172c52; --fg:#eaf1fb; --mut:#9fb3cf; --line:#223963;
  --acc:#6cabdd; --acc-fg:#08142a; --acc-weak:#142c52; --warn:#f0b64a; --warn-weak:#3a2c10; --gold:#d9b45a;
  --court:#2a5f96; --court-line:#e8eef6; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
header{padding-block:18px 8px}
header p{color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav button{flex:1;font:600 15px var(--fb);padding:10px 6px;border:1px solid var(--line);background:var(--surf);color:var(--fg);border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.lab{display:block;font:600 12px var(--fb);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 6px}
.lab:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 16px var(--fb);min-width:44px;min-height:44px;padding:8px 14px;border:1px solid var(--line);background:var(--surf2);color:var(--fg);border-radius:10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
select,textarea,input[type=url],input[type=text]{width:100%;font:16px var(--fb);padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--fg)}
textarea{min-height:70px;resize:vertical}
.btn{font:600 17px var(--fb);padding:13px 18px;border-radius:12px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-fg);cursor:pointer;min-height:48px}
.btn.sec{background:transparent;color:var(--acc)}
.btn.sm{font-size:15px;padding:8px 12px;min-height:40px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prop{background:var(--acc-weak);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.mut{color:var(--mut);font-size:14px}
.blk{margin-top:22px}
.blk>h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blk>h2 span{font:600 15px var(--fb);color:var(--mut)}
.ex{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.ex h3{display:flex;justify-content:space-between;gap:8px}
.min{font:700 18px var(--fd);background:var(--surf2);padding:2px 10px;border-radius:8px;white-space:nowrap;align-self:flex-start}
.org{background:var(--surf2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.ex p.d{margin-top:8px}
.obj{margin-top:10px;font-weight:600}
.obj b{color:var(--acc)}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;min-height:32px}
details ul{margin:6px 0 0;padding-left:20px}
.warn{background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;display:inline-block;margin-top:8px}
.court{width:100%;max-width:170px;height:auto;display:block;margin:8px 0}
.cf{fill:var(--court)} .cl{stroke:var(--court-line);stroke-width:1.6;fill:none}
.zn{fill:var(--arrow);fill-opacity:.28;stroke:var(--arrow);stroke-width:1.2}
.ar{stroke:var(--arrow);stroke-width:2.4;fill:none}
.pm{fill:#ff8a3d} .pa{fill:#fff} .pt{font:700 9px var(--fb);text-anchor:middle;fill:#1b2420}
.zt{font:700 14px var(--fb);fill:#fff;text-anchor:middle}
.vid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.vid a{font-weight:600;color:var(--acc)}
.vid input{flex:1 1 180px}
.mat li{margin:2px 0}
.log{margin-top:10px}
.log .t{display:flex;justify-content:space-between;gap:8px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
#campo{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#campo .big{font:700 84px var(--fd);text-align:center;font-variant-numeric:tabular-nums;line-height:1;margin:14px 0}
#campo .big.fine{color:var(--warn)}
#campo .bar{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
#campo .bar i{display:block;height:100%;background:var(--acc);width:0}
.kp{margin:6px 0 0;padding-left:20px}
@media (prefers-reduced-motion:no-preference){.chip,.btn,nav button{transition:background .12s}}

h1,h2,h3{text-transform:uppercase;letter-spacing:.03em}
h1{font-size:34px;font-style:italic} h2{font-size:25px} h3{font-size:20px}
.hero{display:flex;align-items:center;gap:14px;margin-top:max(12px,env(safe-area-inset-top,0px));padding:16px;border-radius:16px;color:#fff;border-bottom:4px solid #d9b45a;
  background:linear-gradient(135deg,#0b2a55 0%,#0a1f40 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(#ffffff14,#ffffff14) 78% 0/2px 100% no-repeat,
  linear-gradient(#ffffff14,#ffffff14) 0 62%/100% 2px no-repeat;pointer-events:none}
.hero img{height:60px;width:auto;flex:none;position:relative;z-index:1}
.hero div{position:relative;z-index:1;min-width:0}
.hero h1{color:#fff;line-height:1}
.hero p{color:#9fc6ea;font:600 13px var(--fb);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
header{padding-block:0 4px}
nav{padding-block:10px}
nav button{font-family:var(--fd);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;border-radius:8px}
nav button[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -3px 0 #d9b45a}
:root[data-theme="dark"] nav button[aria-selected=true]{background:#1c3a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-selected=true]{background:#1c3a6b}}
.min{background:#0b2a55;color:#e8c766;font:700 20px var(--fd);letter-spacing:.04em;border-radius:6px;padding:2px 10px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px #d9b45a55}
.blk>h2{border-bottom:3px solid var(--sky);padding-bottom:6px}
.blk>h2 span{font:700 16px var(--fd);color:var(--mut);letter-spacing:.06em}
.ex{border-left:5px solid var(--sky)}
.chip{font-weight:600;border-radius:8px}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -3px 0 #d9b45a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed=true]{background:#1c3a6b;border-color:#6cabdd}}
:root[data-theme="dark"] .chip[aria-pressed=true]{background:#1c3a6b;border-color:#6cabdd}
.btn{font-family:var(--fd);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.05em;border-radius:8px;background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 #d9b45a}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--fg);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:#6cabdd;border-color:#6cabdd;color:#08142a}:root:not([data-theme="light"]) .btn.sec{background:transparent;color:#eaf1fb;border-color:#6cabdd;box-shadow:none}}
:root[data-theme="dark"] .btn{background:#6cabdd;border-color:#6cabdd;color:#08142a}
:root[data-theme="dark"] .btn.sec{background:transparent;color:#eaf1fb;border-color:#6cabdd;box-shadow:none}
.btn.sm{font-size:17px}
.obj b,.vid a{color:var(--acc)}
.prop{border-left:5px solid #d9b45a}
#campo .big{font-size:96px;color:var(--fg)}

.dove{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:12px;background:var(--surf2);border-radius:12px;padding:12px}
.dove .court{max-width:150px;margin:0;flex:none}
.dove>div{flex:1 1 180px;min-width:0;font-size:15px}
.dove ul{margin:4px 0 6px;padding-left:18px}
.pw{fill:#fff;fill-opacity:.55;stroke:#fff;stroke-width:1}
.fasi{display:grid;gap:6px;margin-top:10px}
.fasi div{background:var(--surf2);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fasi b{font:700 15px var(--fd);text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.fatto{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.fatto input,.chk input{width:22px;height:22px;accent-color:var(--acc)}
.chk{display:grid;gap:6px}.chk label{display:flex;gap:8px;align-items:center;min-height:32px}
.chip.sm2{min-height:36px;padding:4px 10px;font-size:14px}
.tag{display:inline-block;font:600 13px var(--fb);padding:4px 10px;border-radius:999px;background:var(--surf2);color:var(--mut)}
.tag.on{background:var(--navy);color:#fff}
.alcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.alcard .t{display:flex;justify-content:space-between;gap:8px}
button,select,summary,label,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ver{margin-top:28px;text-align:center;color:var(--mut);font-size:12px}
</style>
</head>

X({i:"r1",b:"r",n:"Mobilità in movimento",p:"a",g:1,d:"Cammina con il gruppo lungo la linea di fondo e quella di servizio. Alterna passo laterale, passo incrociato, skip basso e rotazione delle spalle. Chiudi con 3 allunghi brevi verso la rete.",c:"Spalle rilassate. Passi piccoli e rapidi. Respira piano.",e:"Troppa fretta. Spalle alzate.",f:"Solo camminata e rotazioni.",h:"Aggiungi salti brevi tra un passo e l'altro.",o:"Tutti caldi prima del primo colpo.",q:"riscaldamento padel mobilità prima della lezione"});
X({i:"r2",b:"r",n:"Scaletta e coni",m:"scaletta,coni",g:2,d:"Stendi la scaletta e metti 4 coni a 5 metri. Ognuno fa tre schemi: un piede per quadrato, due piedi per quadrato, laterale. Dopo ogni schema, scatto fino al cono.",c:"Testa alta. Appoggio sull'avampiede. Gomiti piegati.",e:"Sguardo sui piedi. Passi troppo lunghi.",f:"Solo il primo schema, a passo lento.",h:"Aggiungi la racchetta in mano e un colpo a vuoto a fine scaletta.",o:"3 passaggi puliti, senza toccare le corde della scaletta.",q:"scaletta propriocettiva esercizi padel"});
X({i:"r3",b:"r",n:"Palleggio morbido a metà campo",k:"maestro",y:2,g:1,d:"Palleggiate tra le linee di servizio per 2 minuti, con palla alta e lenta. Poi allargate piano verso il fondo, senza forzare.",c:"Conta i palleggi. Palla alta, mano morbida.",e:"Colpi forti. Racchetta stretta.",f:"Palleggio a mano, poi con la racchetta.",h:"Palleggio solo di rovescio per 1 minuto.",o:"20 scambi di fila.",s:"par",q:"padel riscaldamento palleggio mini padel"});
X({i:"r4",b:"r",n:"Caccia ai colori",p:"b",m:"coni",x:2,g:1,d:"Disponi i coni di colori diversi sul campo. Dici un colore e i bambini corrono a toccarlo. Poi chiedi di toccarlo con la racchetta, poi camminando indietro.",c:"Guarda me. Parti al mio via. Torna al centro.",e:"Partenze in anticipo. Corse senza guardare.",f:"Si cammina invece di correre.",h:"Dici due colori in fila e il bambino li tocca in ordine.",o:"Tutti toccano 5 colori senza fermarsi.",q:"giochi riscaldamento bambini tennis padel coni"});
X({i:"r5",b:"r",n:"Equilibrio con la pallina",p:"b",m:"cerchi",g:1,d:"Ogni bambino cammina con la pallina in equilibrio sulla racchetta. Passa dentro i cerchi a terra e torna al punto di partenza.",c:"Occhi sulla pallina. Passi piccoli. Racchetta piatta.",e:"Racchetta inclinata. Corsa troppo rapida.",f:"Pallina grande e cerchi più vicini.",h:"Aggiungi un giro intero su sé stesso dentro un cerchio.",o:"Percorso completo senza far cadere la pallina.",q:"giochi equilibrio pallina racchetta bambini"});
X({i:"r6",b:"r",n:"Staffetta con la pallina",p:"b",x:2,g:2,d:"Due squadre. Ogni bambino porta la pallina sulla racchetta fino al cono e torna. Poi tocca al compagno.",c:"Cammina veloce, non correre. Se cade, riparti da lì.",e:"Si corre e la pallina cade.",f:"Una sola squadra contro il tempo.",h:"Palleggio ogni 3 passi.",o:"La squadra finisce il giro in meno di un minuto.",q:"staffetta bambini racchetta pallina"});
X({i:"r7",b:"r",n:"Bande per spalle e anche",p:"a",m:"bande",g:1,d:"Con la banda elastica fai 10 aperture di spalle, 10 passi laterali con la banda alle ginocchia, 10 rotazioni del busto.",c:"Schiena dritta. Movimento lento. Non perdere la tensione.",e:"Spalle in avanti. Ginocchia che cedono.",f:"Banda più morbida.",h:"Aggiungi una pausa di 2 secondi a fine movimento.",o:"3 serie senza perdere postura.",q:"bande elastiche riscaldamento spalle padel"});
X({i:"r8",b:"r",n:"Lancia e prendi in diagonale",k:"coppie",x:1,g:1,d:"Lanciate la pallina in diagonale con la mano del colpo, poi con l'altra. Un minuto per mano. Poi lo stesso gioco con la racchetta, palla bassa e lenta.",c:"Guarda la pallina fino alla mano. Piedi in movimento.",e:"Lanci senza muovere i piedi.",f:"Lanci da vicino.",h:"Aggiungi un rimbalzo sulla parete.",o:"15 lanci di fila presi senza errori.",q:"riscaldamento coordinazione padel palline"});

X({i:"d1",b:"d",n:"Stretching guidato",p:"a",g:1,d:"Sei allunghi da 20 secondi: spalla, avambraccio, quadricipite, polpaccio, schiena, collo. Guidi tu il ritmo.",c:"Respira piano. Non rimbalzare.",e:"Allunghi dolorosi.",f:"Meno secondi.",h:"Aggiungi un secondo giro.",o:"Tutti seguono la sequenza completa.",q:"stretching dopo padel"});
X({i:"d2",b:"d",n:"Ultimi colpi liberi e parere",g:1,d:"Ognuno gioca 5 colpi liberi. Poi in cerchio ogni allievo dice una cosa riuscita e una da portare alla prossima lezione.",c:"Parla per ultimo tu. Ascolta.",e:"Troppe correzioni a fine lezione.",f:"Solo la cosa riuscita.",h:"L'allievo sceglie il tema della prossima volta.",o:"Ogni allievo dice due frasi.",q:"feedback fine lezione allenatore"});
X({i:"d3",b:"d",n:"Bersaglio finale",p:"b",m:"cerchi,palline",g:1,d:"Ogni bambino ha 3 palline e prova a colpire un cerchio a terra. Poi applauso e saluto.",c:"Un tiro alla volta. Aspetta il tuo turno.",e:"Tiri forti.",f:"Cerchio più vicino.",h:"Cerchio più piccolo.",o:"Almeno 1 centro su 3.",q:"gioco bersaglio bambini padel"});
X({i:"d4",b:"d",n:"Respiro e domande",p:"a",g:1,d:"Cinque respiri lenti. Poi chiedi: cosa era chiaro? Cosa no? Segna le risposte per la prossima lezione.",c:"Domande aperte. Ascolta senza interrompere.",e:"Rispondere al posto dell'allievo.",f:"Una sola domanda.",h:"L'allievo ripete il compito di casa.",o:"L'allievo dice una cosa chiara e una da rivedere.",q:"defaticamento padel"});

X({i:"im1",b:"t",t:"imp",l:"1",n:"L'impugnatura e il palleggio in aria",g:1,d:"Mostra l'impugnatura continental. La V tra pollice e indice cade sul bordo superiore del manico. Fai trovare l'impugnatura a ognuno, poi 10 colpi a vuoto e 10 palleggi in aria.",c:"Mano rilassata. Polso fermo. Impugnatura morbida.",e:"Impugnatura troppo stretta. Mano troppo bassa sul manico.",f:"Solo palleggi in aria senza muoversi.",h:"Cambia impugnatura tra diritto e volée.",o:"10 palleggi in aria di fila con l'impugnatura corretta.",q:"impugnatura continental padel come impugnare racchetta"});
X({i:"im2",b:"t",t:"imp",l:"1",n:"Palleggio a terra e in aria",g:1,d:"Palleggia sulla racchetta alternando le due facce. Poi lascia rimbalzare la pallina a terra e riprendila con la racchetta. Gli adulti contano, i bambini sfidano il loro record.",c:"Guarda la pallina. Racchetta piatta. Ginocchia morbide.",e:"Colpi troppo alti. Braccio rigido.",f:"Solo palleggio a terra.",h:"Palleggio camminando in avanti.",o:"15 palleggi di fila.",q:"controllo pallina racchetta padel principianti"});
X({i:"im3",b:"t",t:"imp",l:"1",n:"Colpire piano contro la parete",m:"palline",g:2,d:"A tre metri dalla parete di fondo, lancia la pallina, lasciala rimbalzare una volta e colpiscila piano verso la parete. Lasciala tornare e ripeti.",c:"Un rimbalzo, poi colpo. Colpo basso e morbido.",e:"Colpire la pallina al volo. Troppa forza.",f:"Due metri dalla parete.",h:"Alterna diritto e rovescio.",o:"8 colpi di fila contro la parete.",q:"principianti padel colpire contro parete esercizio"});

X({i:"di1",b:"t",t:"dir",l:"1",k:"cesto",m:"cesto,palline",g:1,s:"cesto",n:"Diritto dal cesto, palla morbida",d:"Stai nel campo opposto vicino alla rete. Lancia la palla con un rimbalzo, a metà altezza, sul lato del diritto. L'allievo gioca ogni palla verso il centro del campo.",c:"Preparazione anticipata. Spalle di lato. Impatto davanti al corpo. Finale alto sulla spalla opposta.",e:"Colpo troppo vicino al corpo. Polso che cede. Piedi fermi.",f:"Lancia più lento e più vicino all'allievo.",h:"Chiedi un bersaglio dietro la linea di servizio.",o:"6 colpi su 10 oltre la rete e dentro il campo.",q:"diritto padel principianti tecnica"});
X({i:"di2",b:"t",t:"dir",l:"12",k:"coppie",s:"cross",n:"Diritto in cross",g:2,d:"Due giocatori in diagonale. Si palleggia in diagonale solo di diritto, da fondo campo. Contate gli scambi e provate a battere il record.",c:"Palla alta oltre la rete. Torna al centro dopo ogni colpo.",e:"Si guarda la palla e non si torna al centro.",f:"Palleggio dopo il primo rimbalzo, senza fretta.",h:"Gioca un diritto profondo e uno corto, in alternanza.",o:"10 scambi di fila.",q:"diritto diagonale padel esercizio coppie"});
X({i:"di3",b:"t",t:"dir",l:"23",k:"cesto",m:"cesto,palline,coni",g:2,s:"cesto",n:"Diritto a bersaglio",d:"Metti 2 coni vicino alla parete di fondo avversaria. L'allievo gioca il diritto e prova a passare tra i coni, in profondità.",c:"Spalle chiuse. Colpo davanti. Finale lungo verso il bersaglio.",e:"Colpo corto. Si guarda il bersaglio troppo presto.",f:"Coni più larghi.",h:"Coni più stretti e lancio più veloce.",o:"4 su 10 nella zona dei coni.",q:"diritto profondo padel esercizio bersaglio"});
X({i:"di4",b:"t",t:"dir",l:"23",k:"cesto",m:"cesto,palline",g:3,s:"cesto",n:"Diritto con taglio",d:"Mostra il movimento dall'alto verso il basso, con la faccia della racchetta leggermente aperta. L'allievo gioca palle lente e cerca il rimbalzo basso. Poi confronta con un colpo piatto.",c:"Racchetta alta all'inizio. Scendi sotto la palla. Finisci davanti.",e:"Faccia troppo aperta. Colpo che muore in rete.",f:"Faccia meno aperta, palla più alta.",h:"Taglio in corsa, con palla più veloce.",o:"5 su 10 con rimbalzo basso dopo la parete.",q:"diritto tagliato padel tecnica slice"});
X({i:"ro1",b:"t",t:"rov",l:"1",k:"cesto",m:"cesto,palline",g:1,s:"cesto",n:"Rovescio dal cesto, palla morbida",d:"Come il diritto, ma sul lato del rovescio. Lancia a metà altezza con un rimbalzo. L'allievo ruota le spalle, porta indietro la racchetta e colpisce davanti.",c:"Spalla verso la rete. Colpisci davanti. Braccio disteso.",e:"Si colpisce troppo tardi. Gomito che si chiude.",f:"Lancio più lento e più basso.",h:"Chiedi il colpo in diagonale.",o:"5 colpi su 10 oltre la rete e dentro il campo.",q:"rovescio padel principianti tecnica"});
X({i:"ro2",b:"t",t:"rov",l:"12",k:"coppie",s:"par",n:"Rovescio lungo linea",g:2,d:"Due giocatori sulla stessa fascia, uno per lato della rete. Si palleggia solo di rovescio lungo la linea. Contate gli scambi.",c:"Piedi di lato. Palla alta. Torna al centro.",e:"Colpire troppo vicino al corpo.",f:"Un rimbalzo in più e palla lenta.",h:"Rovescio profondo e uno corto, in alternanza.",o:"8 scambi di fila.",q:"rovescio lungo linea padel esercizio coppie"});
X({i:"ro3",b:"t",t:"rov",l:"23",k:"cesto",m:"cesto,palline,coni",g:3,s:"cesto",n:"Rovescio profondo a bersaglio",d:"Metti 2 coni vicino al fondo. L'allievo gioca il rovescio e prova a passare tra i coni, con palla alta e profonda.",c:"Spalle ben ruotate. Finale lungo.",e:"Colpo corto. Sguardo troppo presto sul bersaglio.",f:"Coni più larghi.",h:"Lancio più veloce.",o:"4 su 10 nella zona dei coni.",q:"rovescio profondo padel esercizio"});

X({i:"vo1",b:"t",t:"vol",l:"1",k:"cesto",m:"cesto,palline",g:1,s:"rete",n:"Volée di blocco dal cesto",d:"L'allievo sta a un metro e mezzo dalla rete. Lancia palle lente, a mezza altezza, sul diritto e poi sul rovescio. Il colpo è corto, senza grande movimento.",c:"Racchetta davanti. Gomito davanti al corpo. Blocca e accompagna.",e:"Braccio che parte troppo indietro. Polso molle.",f:"Palle più lente e tutte sul diritto.",h:"Alterna diritto e rovescio senza avviso.",o:"6 volée su 10 in campo.",q:"volée padel principianti tecnica"});
X({i:"vo2",b:"t",t:"vol",l:"12",k:"coppie",s:"rete",n:"Volée contro volée",g:2,d:"Due giocatori a rete, uno per lato. Si scambiano volée corte e lente. Ogni 10 scambi fate un passo indietro.",c:"Racchetta davanti. Passi piccoli. Colpo corto.",e:"Colpi forti. Racchetta che cade.",f:"Una volée e un rimbalzo, alternati.",h:"Volée solo di rovescio.",o:"15 scambi di fila.",q:"volée contro volée padel esercizio"});
X({i:"vo3",b:"t",t:"vol",l:"23",k:"cesto",m:"cesto,palline,coni",g:3,s:"rete",n:"Volée profonda a zona",d:"L'allievo sta a rete. Lancia palle a diverse altezze. Chiedi la volée profonda verso due coni vicino al fondo.",c:"Passo verso la palla. Blocca e spingi in avanti.",e:"Volée corta. Corpo che si apre.",f:"Zona più grande.",h:"Aggiungi un passo indietro dopo ogni colpo.",o:"5 su 10 nella zona dei coni.",q:"volée profonda padel esercizio"});
X({i:"vo4",b:"t",t:"vol",l:"23",k:"cesto",m:"cesto,palline",g:3,s:"rete",n:"Volée alta",d:"Lancia palle alte sulla testa dell'allievo. Chiedi un passo indietro e un colpo davanti al corpo, con braccio disteso.",c:"Passo indietro. Colpo sopra la testa, davanti.",e:"Colpo dietro la testa. Braccio piegato.",f:"Palle meno alte.",h:"Lancia ancora più alto e più veloce.",o:"4 su 10 in campo.",q:"volée alta padel tecnica"});

X({i:"ba1",b:"t",t:"ban",l:"2",p:"a",g:1,s:"rete",n:"Bandeja a vuoto",d:"Senza palla, l'allievo ripete il gesto: lato del corpo verso la rete, racchetta alta, colpo corto dall'alto verso il basso e rientro. Gli mostri il gesto una volta, lento.",c:"Corpo di lato. Racchetta alta. Colpo corto. Rientro in due passi.",e:"Braccio troppo teso. Colpo troppo largo.",f:"Rallenta il gesto.",h:"Aggiungi il passo indietro prima del gesto.",o:"10 gesti corretti di fila.",q:"bandeja padel tecnica spiegata"});
X({i:"ba2",b:"t",t:"ban",l:"2",p:"a",k:"cesto",m:"cesto,palline",g:2,s:"cesto",n:"Bandeja dal cesto",d:"Lancia un lob dal campo opposto. L'allievo arretra, gira il corpo e gioca la bandeja verso il fondo, con colpo corto e controllato.",c:"Gira il corpo presto. Racchetta alta. Colpisci davanti. Ricomponi.",e:"Si colpisce dietro la testa. Palla troppo corta.",f:"Lob più basso e più lento.",h:"Lob più lungo e verso un lato.",o:"5 su 10 oltre il fondo della linea di servizio.",q:"bandeja padel esercizio dal cesto"});
X({i:"ba3",b:"t",t:"ban",l:"23",p:"a",k:"cesto",m:"cesto,palline",g:3,s:"cesto",n:"Bandeja e rientro a rete",d:"Dopo ogni bandeja l'allievo torna alla posizione a rete in due passi. Lanci il lob successivo appena è tornato in posizione.",c:"Bandeja, due passi, racchetta pronta.",e:"Rimane indietro dopo il colpo.",f:"Aspetta il segnale prima del lob successivo.",h:"Lanci subito, senza pausa.",o:"6 rientri corretti su 10.",q:"bandeja rientro rete padel esercizio"});
X({i:"ba4",b:"t",t:"ban",l:"3",p:"a",k:"cesto",m:"cesto,palline",g:3,s:"cesto",n:"Vibora",d:"Mostra il colpo laterale con taglio, un po' più veloce della bandeja. L'allievo prova dieci palline lente, poi dieci a ritmo normale.",c:"Taglio laterale. Colpo più teso. Piedi stabili.",e:"Il colpo diventa uno smash. Si perde la direzione.",f:"Ripeti con la bandeja.",h:"Aggiungi un bersaglio nel corridoio laterale.",o:"4 su 10 che rimangono bassi dopo la parete.",q:"vibora padel tecnica"});

X({i:"sm1",b:"t",t:"smash",l:"12",k:"cesto",m:"cesto,palline",g:2,s:"cesto",n:"Smash dal cesto",d:"Lancia un lob alto e lento. L'allievo fa un passo laterale, porta la racchetta sopra la testa e colpisce davanti, con braccio disteso.",c:"Passo laterale. Mano sinistra verso la palla. Colpo in alto.",e:"Si resta sotto la palla. Braccio piegato.",f:"Lob più basso, con mano sinistra verso la palla.",h:"Lob più alto e più lungo.",o:"4 su 10 in campo.",q:"smash padel tecnica principianti"});
X({i:"sm2",b:"t",t:"smash",l:"23",k:"cesto",m:"cesto,palline",g:3,s:"cesto",n:"Smash e recupero",d:"Dopo ogni smash l'allievo torna in posizione a rete. Lancia il lob successivo appena è tornato.",c:"Colpisci, torna, racchetta pronta.",e:"Si guarda il colpo e si resta fermi.",f:"Aspetta il tuo segnale.",h:"Lancia con un secondo di anticipo.",o:"6 rientri corretti su 10.",q:"smash padel allenamento recupero posizione"});

X({i:"ba5",b:"t",t:"bat",l:"1",k:"tutti",m:"palline",g:1,n:"Battuta: lancio e colpo",d:"La battuta si fa dal basso, sotto la vita, dopo un rimbalzo. Mostra il gesto, poi ognuno prova 10 battute in diagonale senza paura dell'errore.",c:"Rimbalzo, poi colpo sotto la vita. Racchetta in avanti.",e:"Colpire sopra la vita. Rimbalzo troppo lontano.",f:"Battuta da vicino alla rete.",h:"Battuta su un lato preciso.",o:"6 battute su 10 nel quadrato giusto.",q:"battuta padel regole tecnica"});
X({i:"ba6",b:"t",t:"bat",l:"12",k:"coppie",g:2,s:"cross",n:"Battuta in diagonale su zona",m:"coni",d:"Metti un cono nel quadrato di servizio. Chi batte prova a colpire la zona vicino al cono. Il compagno risponde piano.",c:"Palla profonda nel quadrato. Fai la routine ogni volta.",e:"Battuta troppo forte.",f:"Zona più larga.",h:"Cono verso il vetro laterale.",o:"5 su 10 nella zona del cono.",q:"battuta padel zona esercizio"});
X({i:"ba7",b:"t",t:"bat",l:"23",k:"coppie",g:3,s:"cross",n:"Risposta bassa ai piedi",d:"Uno batte, l'altro risponde corto e basso verso i piedi di chi sale a rete. Poi invertite.",c:"Palla bassa. Finale corto. Entra in campo.",e:"Risposta alta. Troppo lontano dalla linea.",f:"Servizio lento.",h:"Servizio con più velocità.",o:"4 su 10 che arrivano ai piedi.",q:"risposta battuta padel bassa"});

X({i:"pa1",b:"t",t:"par",l:"12",k:"cesto",m:"cesto,palline",g:2,s:"parete",n:"Aspetta la parete di fondo",d:"Lancia forte la palla in modo che rimbalzi, tocchi il parete di fondo e rientri. L'allievo aspetta, si gira e colpisce solo dopo il rimbalzo sul vetro.",c:"Aspetta. Guarda la palla uscire dal vetro. Colpisci davanti.",e:"Colpire troppo presto. Troppa fretta.",f:"Palla più lenta.",h:"Palla più forte e più angolata.",o:"5 su 10 giocate in campo dopo il vetro.",q:"parete di fondo padel esercizio uscita"});
X({i:"pa2",b:"t",t:"par",l:"23",k:"cesto",m:"cesto,palline",g:3,s:"parete",n:"Uscita dalla parete laterale",d:"Lancia palle che toccano prima il campo e poi la parete laterale. L'allievo si sposta di lato, lascia scendere la palla e gioca in diagonale.",c:"Spazio dal vetro. Aspetta. Colpo basso e lungo.",e:"Troppo vicino alla parete. Colpo in ritardo.",f:"Palla lenta.",h:"Palle più veloci.",o:"4 su 10 in diagonale.",q:"parete laterale padel uscita esercizio"});
X({i:"pa3",b:"t",t:"par",l:"2",k:"coppie",g:2,s:"parete",n:"Ping pong con il vetro",d:"Due giocatori da fondo campo. Ogni palla deve toccare il parete di fondo prima di tornare. Contate gli scambi.",c:"Palla bassa e lenta. Aspetta il rimbalzo.",e:"Colpi forti. Palla che esce.",f:"Colpo piano.",h:"Alterna la parete di fondo e quella laterale.",o:"8 scambi di fila.",q:"parete padel esercizio coppie"});

X({i:"lo1",b:"t",t:"lob",l:"12",k:"cesto",m:"cesto,palline",g:2,s:"lob",n:"Lob dal cesto",d:"L'allievo sta a metà campo. Lancia palle basse. Chiedi un colpo che sale in alto e cade nel fondo avversario.",c:"Faccia della racchetta aperta. Finale alto. Spingi con le gambe.",e:"Lob corto. Si colpisce di polso.",f:"Palla più lenta e a mezza altezza.",h:"Aggiungi un bersaglio in fondo.",o:"5 lob su 10 oltre la linea di servizio.",q:"lob padel tecnica"});
X({i:"lo2",b:"t",t:"lob",l:"23",k:"coppie",g:3,s:"lob",n:"Lob in diagonale",d:"Due giocatori in diagonale. Uno sta a rete, l'altro da fondo. Chi sta a rete manda la palla in lob e l'altro risponde in lob.",c:"Altezza prima di tutto. Cadere dietro la linea di servizio.",e:"Lob corto. Palla senza altezza.",f:"Lob più lento.",h:"Lob con effetto.",o:"6 lob su 10 profondi.",q:"lob padel diagonale esercizio"});
X({i:"lo3",b:"t",t:"lob",l:"23",k:"cesto",m:"cesto,palline",g:3,s:"lob",n:"Difesa di una palla alta",d:"Lancia palle alte verso il fondo. L'allievo arretra, aspetta il rimbalzo e risponde con un lob o con una palla alta e lenta.",c:"Passi indietro. Aspetta. Palla alta come risposta.",e:"Rimane troppo vicino alla rete.",f:"Palla meno alta.",h:"Palle più veloci.",o:"5 risposte su 10 alte e profonde.",q:"difesa padel palla alta"});

X({i:"po1",b:"t",t:"pos",l:"1",g:1,s:"stz",n:"Passi sul campo a vuoto",m:"scaletta",d:"Fai 4 stazioni sul campo. Ogni stazione è un passo diverso: laterale, indietro, avanti, incrociato. Ripeti con la racchetta in mano e un colpo a vuoto.",c:"Gambe flesse. Passi piccoli. Ripresa del centro.",e:"Passi troppo lunghi.",f:"Solo due stazioni.",h:"Aggiungi un cambio di direzione.",o:"3 giri senza fermarsi.",q:"spostamenti padel esercizi footwork"});
X({i:"po2",b:"t",t:"pos",l:"12",k:"coppie",g:2,s:"par",n:"Salita a rete in coppia",d:"Due giocatori da fondo. Quando il compagno gioca un lob, l'altro sale a rete. Poi salgono insieme.",c:"Sali insieme. Chi non gioca controlla il compagno.",e:"Uno sale e l'altro resta indietro.",f:"Parti da metà campo.",h:"Aggiungi un colpo di volée alla salita.",o:"4 salite su 8 insieme.",q:"salita a rete padel coppia"});
